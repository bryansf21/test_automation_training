name: CI test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu_latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source

      - name: Run tests
        run: pytest -q

      - name: Generate data and run evaluation
        run: |
          python -m src.generate_data
          python -m src.evaluate data/sample_measurements.csv

      - name: Upload result plots as artifacts
        uses: action/upload-artifact@v4
        with:
          name: evaluation-results-py${{ matrix.python-version }}
          path: results/
